name: Build ROM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/stephane-d/sgdk:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ROM
        run: make SGDK_PATH=/sgdk

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-md
          path: out/rom.bin

      - name: Upload rescomp intermediate files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescomp-debug
          path: |
            res/**/*.h
            res/**/*.s
            res/**/*.c
            out/**/*.h
            out/**/*.s
            out/res/**
          if-no-files-found: warn
